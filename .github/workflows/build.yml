name: Build Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use LLVM 19
        shell: pwsh
        run: choco install llvm --version=19.1.7 --allow-downgrade -y

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
